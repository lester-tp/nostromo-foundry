[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nostromo-packager"
version = "0.1.0"
description = "Package human demonstration episodes (video + labels) into robotics-native training formats: LeRobot v2, HDF5, and episodic JSONL."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Nostromo Labs"}]
dependencies = ["pandas>=2.0", "pyarrow>=14.0", "h5py>=3.10"]

[project.scripts]
nostromo-pack = "nostromo_packager.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
